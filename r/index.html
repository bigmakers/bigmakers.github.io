<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>領収書</title>
<style>
  :root {
    --ink: #17171c;
    --sub: #6b6b74;
    --line: #d9d9e0;
    --bg: #f2f2f6;
    --card: #ffffff;
    --warn: #c2410c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 40px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 16px; text-align: center; letter-spacing: 0.08em; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .card img { width: 100%; height: auto; display: block; border-radius: 6px; }
  .note {
    margin-top: 14px;
    font-size: 13px;
    color: var(--sub);
    line-height: 1.7;
    text-align: center;
  }
  .meta { margin-top: 6px; font-size: 12px; color: var(--sub); text-align: center; }
  .status {
    margin-top: 24px;
    text-align: center;
    font-size: 15px;
    line-height: 1.8;
    color: var(--sub);
  }
  .status.error { color: var(--warn); }
  .status strong { display: block; font-size: 16px; color: var(--ink); margin-bottom: 6px; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 12px;
    border: 3px solid var(--line);
    border-top-color: var(--sub);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>領収書</h1>

  <div id="loading" class="status">
    <div class="spinner"></div>
    読み込んでいます…
  </div>

  <div id="viewer" hidden>
    <div class="card">
      <img id="receipt" alt="領収書">
    </div>
    <p class="note">画像を長押しして「写真に追加」で保存してください。</p>
    <p class="meta" id="expiry"></p>
  </div>

  <div id="error" class="status error" hidden>
    <strong id="errorTitle">この領収書は有効期限切れか、存在しません</strong>
    <span id="errorDetail">発行元にお問い合わせください。</span>
  </div>
</main>

<script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js" async></script>
<script>
  // CloudKit Dashboard の API Tokens で発行した「読み取り用」トークンに置き換える。
  // 公開DBの読み取り専用トークンなのでページ埋め込みが CloudKit JS の正規の使い方。
  const API_TOKEN = "c3165671694ebb1a1c46fd9f6bebdccf189f6155110b703e482fc70b1bbc133c";
  const CONTAINER = "iCloud.com.harasaki.NMReceipt";
  // 開発ビルドのアプリから上げたレコードを見るときは "development" に変える。
  // App Store / TestFlight 配布のアプリは "production"(スキーマの本番デプロイを忘れずに)。
  const ENVIRONMENT = "production";
  // レコードタイプは SharedReceipt(フィールド image: Asset / expiresAt: Date/Time)。
  // recordName 直打ちで取るのでクエリ用の型指定は要らない。

  const el = (id) => document.getElementById(id);

  function showError(title, detail) {
    el("loading").hidden = true;
    el("viewer").hidden = true;
    if (title) el("errorTitle").textContent = title;
    if (detail) el("errorDetail").textContent = detail;
    el("error").hidden = false;
  }

  function showImage(url, expiresAt) {
    const img = el("receipt");
    img.onload = () => {
      el("loading").hidden = true;
      el("viewer").hidden = false;
    };
    img.onerror = () => showError(
      "画像を読み込めませんでした",
      "通信状況を確認して、もう一度開いてください。"
    );
    if (expiresAt) {
      const d = new Date(expiresAt);
      el("expiry").textContent =
        "有効期限 " + d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 " +
        String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }
    img.src = url;
  }

  function recordId() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    return id && id.trim() ? id.trim() : null;
  }

  function fetchReceipt() {
    const id = recordId();
    if (!id) {
      showError("領収書が指定されていません", "発行元から渡されたQRコードを読み取り直してください。");
      return;
    }

    CloudKit.configure({
      containers: [{
        containerIdentifier: CONTAINER,
        apiTokenAuth: { apiToken: API_TOKEN, persist: false },
        environment: ENVIRONMENT
      }]
    });

    const database = CloudKit.getDefaultContainer().publicCloudDatabase;

    // クエリは使わず recordName 直打ちで取得する(URLを知る人だけが開ける)
    database.fetchRecords([id]).then((response) => {
      if (response.hasErrors) {
        const first = response.errors[0];
        console.error(first);
        // 見つからない場合だけ「期限切れか存在しない」。通信・設定不備は別文言にする。
        if (first && (first.ckErrorCode === "NOT_FOUND" || first.serverErrorCode === "NOT_FOUND")) {
          showError();
        } else {
          showError("読み込みに失敗しました", "通信状況を確認して、もう一度開いてください。");
        }
        return;
      }
      const record = response.records && response.records[0];
      if (!record || !record.fields) {
        showError();
        return;
      }

      const expiresField = record.fields.expiresAt;
      const expiresAt = expiresField ? expiresField.value : null;
      if (expiresAt && Date.now() > expiresAt) {
        showError();
        return;
      }

      const imageField = record.fields.image;
      const downloadURL = imageField && imageField.value ? imageField.value.downloadURL : null;
      if (!downloadURL) {
        showError();
        return;
      }

      showImage(downloadURL, expiresAt);
    }).catch((error) => {
      console.error(error);
      showError("読み込みに失敗しました", "通信状況を確認して、もう一度開いてください。");
    });
  }

  if (window.CloudKit) {
    fetchReceipt();
  } else {
    window.addEventListener("cloudkitloaded", fetchReceipt);
    // CDNが落ちている等で cloudkit.js が来ない場合の保険
    setTimeout(() => {
      if (!window.CloudKit) {
        showError("読み込みに失敗しました", "通信状況を確認して、もう一度開いてください。");
      }
    }, 10000);
  }
</script>
</body>
</html>
